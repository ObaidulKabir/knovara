name: ice

services:
  postgres:
    build:
      context: ./postgres
    environment:
      POSTGRES_DB: ice
      POSTGRES_USER: ice
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ice_dev_password}
    ports:
      - "${POSTGRES_HOST_PORT:-5442}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ice -d ice"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "${RABBITMQ_HOST_PORT:-5672}:5672"
      - "${RABBITMQ_UI_HOST_PORT:-15672}:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: src/ICE.Api/Dockerfile
    environment:
      # The .NET runtime image has no Kerberos libraries, so don't let Npgsql try GSS encryption.
      ConnectionStrings__Postgres: "Host=postgres;Database=ice;Username=ice;Password=${POSTGRES_PASSWORD:-ice_dev_password};GSS Encryption Mode=Disable"
      RabbitMq__Host: "rabbitmq"
      ASPNETCORE_URLS: "http://+:8080"
    ports:
      - "${API_HOST_PORT:-5000}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  document-processing-worker:
    build:
      context: ../workers/document-processing
    environment:
      RABBITMQ_URL: "amqp://guest:guest@rabbitmq:5672/"
      ICE_API_BASE_URL: "${ICE_API_BASE_URL:-http://api:8080}"
      SOURCE_ROOT: "/sources"
    volumes:
      - sources:/sources:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      rabbitmq:
        condition: service_healthy

volumes:
  postgres_data:
  sources:

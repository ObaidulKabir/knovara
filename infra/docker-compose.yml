name: knovara

services:
  postgres:
    build:
      context: ./postgres
    environment:
      POSTGRES_DB: knovara
      POSTGRES_USER: knovara
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-knovara_dev_password}
    ports:
      - "${POSTGRES_HOST_PORT:-5442}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U knovara -d knovara"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "${RABBITMQ_HOST_PORT:-5672}:5672"
      - "${RABBITMQ_UI_HOST_PORT:-15672}:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  model-service:
    build:
      context: ../services/model-service
    environment:
      # Fewer ONNX Runtime threads means smaller per-thread arena buffers; under sustained load
      # (e.g. the benchmark) this container's memory climbed enough to be OOM-killed at the
      # default (auto-detected) thread count on this machine's 2-4 visible cores.
      MODEL_THREADS: "2"
    ports:
      - "${MODEL_SERVICE_HOST_PORT:-8090}:8000"
    mem_limit: ${MODEL_SERVICE_MEM_LIMIT:-2200m}
    restart: on-failure
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 12

  api:
    build:
      context: ..
      dockerfile: src/Knovara.Api/Dockerfile
    environment:
      # The .NET runtime image has no Kerberos libraries, so don't let Npgsql try GSS encryption.
      ConnectionStrings__Postgres: "Host=postgres;Database=knovara;Username=knovara;Password=${POSTGRES_PASSWORD:-knovara_dev_password};GSS Encryption Mode=Disable"
      RabbitMq__Host: "rabbitmq"
      ModelService__BaseUrl: "http://model-service:8000"
      ASPNETCORE_URLS: "http://+:8080"
    ports:
      - "${API_HOST_PORT:-5000}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      model-service:
        condition: service_healthy

  document-processing-worker:
    build:
      context: ../workers/document-processing
    environment:
      RABBITMQ_URL: "amqp://guest:guest@rabbitmq:5672/"
      KNOVARA_API_BASE_URL: "${KNOVARA_API_BASE_URL:-http://api:8080}"
      SOURCE_ROOT: "/sources"
    volumes:
      - sources:/sources:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    mem_limit: ${WORKER_MEM_LIMIT:-1800m}
    restart: on-failure
    depends_on:
      rabbitmq:
        condition: service_healthy

  # The SaaS control plane: accounts, tenants, desktop enrollment and installer downloads.
  # Not started by default; run it with:  docker compose --profile saas up -d control-plane
  # It needs TOKEN_SIGNING_KEY (32+ bytes, the SAME value as the API's Authentication__SigningKey) and, on first
  # start, CONTROL_PLANE_ADMIN_EMAIL / CONTROL_PLANE_ADMIN_PASSWORD to create the first operator account.
  # Put it behind HTTPS before exposing it: it sets a sign-in cookie and hands out credentials.
  control-plane:
    profiles: ["saas"]
    build:
      context: ..
      dockerfile: src/Knovara.ControlPlane/Dockerfile
    environment:
      ConnectionStrings__Postgres: "Host=postgres;Database=knovara;Username=knovara;Password=${POSTGRES_PASSWORD:-knovara_dev_password};GSS Encryption Mode=Disable"
      Tokens__SigningKey: "${TOKEN_SIGNING_KEY:-}"
      Tokens__Issuer: "knovara-control-plane"
      Tokens__Audience: "knovara-api"
      # Where enrolled desktops are told to send requests: the API's address as the desktops see it.
      DataPlane__BaseUrl: "${DATA_PLANE_PUBLIC_URL:-http://localhost:5000}"
      Bootstrap__AdminEmail: "${CONTROL_PLANE_ADMIN_EMAIL:-}"
      Bootstrap__AdminPassword: "${CONTROL_PLANE_ADMIN_PASSWORD:-}"
      ASPNETCORE_URLS: "http://+:8080"
    ports:
      - "${CONTROL_PLANE_HOST_PORT:-5400}:8080"
    volumes:
      - control_plane_data:/data
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  sources:
  control_plane_data:
